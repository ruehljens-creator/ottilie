# Beispiel: nginx vor der Zentrale (Variante 2 – auf dem Testserver nicht nötig, dort macht das tailscale serve).
# TLS-Zertifikat und Servername anpassen. WebSocket-Upgrade für /ws, Zeitlimits 120 s (Lebenszeichen alle 30 s).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name zentrale.example.org;
    ssl_certificate     /etc/nginx/tls/zentrale.crt;
    ssl_certificate_key /etc/nginx/tls/zentrale.key;
    client_max_body_size 200m;            # Wiederherstellen einer Sicherung

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # nicht anhängen: nur die echte Adresse
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Unterpfad-Betrieb (https://server/zentrale/): im Container ZENTRALE_OEFFENTLICH=https://server/zentrale setzen und
#   location /zentrale/ { proxy_pass http://127.0.0.1:8470/; … wie oben … }
